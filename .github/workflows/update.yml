name: Update Trackers

on:
  schedule:
    # Once daily ≈ 06:00 America/New_York (EDT). Never more than once/day.
    - cron: '0 10 * * *'
  push:
    branches: [main]
  workflow_dispatch:  # Lets you trigger manually from the Actions tab

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Validate Python sources
        run: |
          python - <<'PY'
          import sys
          import unicodedata
          from pathlib import Path

          bad_locations = []
          for path in Path(".").rglob("*.py"):
              text = path.read_text(encoding="utf-8")
              for line_number, line in enumerate(text.splitlines(), start=1):
                  for char in line:
                      if unicodedata.category(char) == "Cf":
                          bad_locations.append((path, line_number, f"U+{ord(char):04X}"))

          if bad_locations:
              print("ERROR: Found invisible Unicode format characters in Python files:")
              for path, line_number, codepoint in bad_locations:
                  print(f" - {path}:{line_number} ({codepoint})")
              sys.exit(1)

          print("No invisible Unicode format characters found in Python files.")
          PY

      - name: Validate update.py syntax
        run: python -m py_compile update.py

      - name: Run trackers
        env:
          CONGRESS_API_KEY: ${{ secrets.CONGRESS_API_KEY }}
        run: python update.py

      - name: Commit data changes
        run: |
          git config user.name "roach-roundup-bot"
          git config user.email "bot@roachroundup.com"
          git add data/ docs/
          git diff --staged --quiet || git commit -m "Update tracker data [skip ci]"
          git push

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
